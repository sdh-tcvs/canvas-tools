<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPT 미디어 추출기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f8f8f6; --surface: #ffffff; --surface2: #f2f2ef;
    --border: rgba(0,0,0,0.1); --border2: rgba(0,0,0,0.18);
    --text: #1a1a18; --text2: #6b6b66; --text3: #9a9a95;
    --accent: #2563eb; --accent-bg: #eff6ff; --accent-text: #1d4ed8;
    --success: #16a34a; --warn: #d97706;
    --radius: 10px; --radius-sm: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141412; --surface: #1e1e1c; --surface2: #272725;
      --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.15);
      --text: #f0f0ec; --text2: #9a9a95; --text3: #606060;
      --accent: #3b82f6; --accent-bg: #1e2f4a; --accent-text: #93c5fd;
      --success: #4ade80; --warn: #fbbf24;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 900px; margin: 0 auto; }
  header { margin-bottom: 2rem; }
  header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  header p { font-size: 13px; color: var(--text2); margin-top: 4px; }

  /* Drop zone */
  #dropzone { border: 1.5px dashed var(--border2); border-radius: var(--radius); padding: 2.5rem 2rem; text-align: center; cursor: pointer; transition: border-color .2s, background .2s; background: var(--surface); margin-bottom: 1.25rem; }
  #dropzone:hover, #dropzone.drag { border-color: var(--accent); background: var(--accent-bg); }
  #dropzone svg { width: 38px; height: 38px; color: var(--text3); margin-bottom: 10px; }
  #dropzone strong { font-size: 15px; display: block; margin-bottom: 4px; }
  #dropzone span { font-size: 13px; color: var(--text2); }
  #file-input { display: none; }

  /* Path row */
  .path-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 6px; }
  .path-row label { font-size: 12px; color: var(--text2); white-space: nowrap; flex-shrink: 0; }
  .path-row input { flex: 1; border: none; background: transparent; font-size: 13px; color: var(--text); outline: none; font-family: 'Menlo','Consolas',monospace; min-width: 0; }
  .path-row input::placeholder { color: var(--text3); }
  #pick-dir-btn { font-size: 12px; padding: 5px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface2); color: var(--text); cursor: pointer; white-space: nowrap; transition: background .15s; flex-shrink: 0; }
  #pick-dir-btn:hover { background: var(--border); }
  #dir-note { font-size: 11px; color: var(--text3); margin-bottom: 1.25rem; line-height: 1.5; }

  /* Format */
  .format-row { display: flex; align-items: center; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .format-row label { font-size: 12px; color: var(--text2); }
  .fmt-btn { font-size: 12px; padding: 5px 14px; border-radius: 99px; border: 1px solid var(--border2); background: var(--surface); color: var(--text2); cursor: pointer; transition: all .15s; }
  .fmt-btn.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-text); font-weight: 500; }

  /* Progress */
  #progress-wrap { display: none; margin-bottom: 1rem; }
  #progress-wrap.show { display: block; }
  #progress-bar { height: 3px; border-radius: 99px; background: var(--border); overflow: hidden; }
  #progress-fill { height: 100%; background: var(--accent); border-radius: 99px; width: 0%; transition: width .2s; }

  /* Status */
  #status { font-size: 13px; color: var(--text2); min-height: 1.4em; margin-bottom: 1rem; }
  #status.ok { color: var(--success); }
  #status.err { color: #dc2626; }

  /* Tabs */
  #tabs { display: none; border-bottom: 1px solid var(--border); margin-bottom: 1.25rem; gap: 0; }
  #tabs.show { display: flex; }
  .tab-btn { font-size: 13px; padding: 8px 16px; border: none; background: transparent; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; display: flex; align-items: center; gap: 6px; }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
  .tab-badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--surface2); color: var(--text3); }
  .tab-btn.active .tab-badge { background: var(--accent-bg); color: var(--accent-text); }

  /* Toolbar */
  #toolbar { display: none; align-items: center; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  #toolbar.show { display: flex; }
  .tb-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 7px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface); color: var(--text); cursor: pointer; transition: background .15s; }
  .tb-btn:hover { background: var(--surface2); }
  .tb-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tb-btn.primary:hover { opacity: .9; }
  .count-badge { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
  #search-input { margin-left: auto; font-size: 13px; padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface); color: var(--text); outline: none; width: 180px; transition: border-color .2s; }
  #search-input:focus { border-color: var(--accent); }
  #search-input::placeholder { color: var(--text3); }

  /* Gallery */
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; }
  .img-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color .15s; }
  .img-card:hover { border-color: var(--border2); }
  .img-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,.15); }

  .media-thumb { width: 100%; height: 110px; object-fit: contain; background: var(--surface2); display: block; cursor: pointer; }
  .video-thumb { width: 100%; height: 110px; object-fit: contain; background: #000; display: block; cursor: pointer; }
  .media-nopreview { height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--surface2); font-size: 11px; color: var(--text3); cursor: pointer; gap: 6px; }
  .media-nopreview .type-icon { font-size: 28px; }

  /* Type badge */
  .type-badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-bottom: 4px; font-weight: 500; }
  .type-badge.img { background: #eff6ff; color: #1d4ed8; }
  .type-badge.vid { background: #fef3c7; color: #92400e; }
  .type-badge.gif { background: #f0fdf4; color: #166534; }
  @media (prefers-color-scheme: dark) {
    .type-badge.img { background: #1e3a5f; color: #93c5fd; }
    .type-badge.vid { background: #451a03; color: #fcd34d; }
    .type-badge.gif { background: #14290e; color: #86efac; }
  }

  .img-meta { padding: 8px 10px 10px; }
  .img-name { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; margin-bottom: 4px; }
  .img-actions { display: flex; gap: 6px; }
  .act-btn { flex: 1; font-size: 11px; padding: 4px 0; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface2); color: var(--text2); cursor: pointer; transition: background .15s; text-align: center; }
  .act-btn:hover { background: var(--border); color: var(--text); }
  .act-btn.sel-btn.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-text); }

  #empty { display: none; text-align: center; padding: 3rem; color: var(--text3); font-size: 14px; }
  #empty.show { display: block; }

  /* Lightbox */
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 100; align-items: center; justify-content: center; padding: 2rem; cursor: pointer; }
  #lightbox.show { display: flex; }
  #lb-inner { cursor: default; max-width: 90vw; max-height: 85vh; }
  #lb-inner img, #lb-inner video { max-width: 90vw; max-height: 85vh; border-radius: var(--radius); object-fit: contain; display: block; }
  #lb-close { position: fixed; top: 1.5rem; right: 1.5rem; background: rgba(255,255,255,.15); border: none; color: #fff; font-size: 22px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .video-play-overlay { position: relative; cursor: pointer; }
  .video-play-overlay::after { content: '▶'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; color: rgba(255,255,255,.85); text-shadow: 0 1px 4px rgba(0,0,0,.5); pointer-events: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>PPT 미디어 추출기</h1>
    <p>PPTX 파일에서 이미지, GIF, 동영상을 추출합니다 — 파일은 브라우저 내에서만 처리됩니다</p>
  </header>

  <div id="dropzone" onclick="document.getElementById('file-input').click()" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
      <line x1="9" y1="15" x2="15" y2="15"/><line x1="12" y1="12" x2="12" y2="18"/>
    </svg>
    <strong>PPTX 파일을 여기에 드래그하거나 클릭해서 선택</strong>
    <span>.pptx 파일 지원 · 이미지(PNG/JPG/WebP…) + GIF + 동영상(MP4/AVI/MOV…) 모두 추출</span>
  </div>
  <input type="file" id="file-input" accept=".pptx" onchange="onFileSelect(this.files[0])">

  <div class="path-row">
    <label>저장 폴더</label>
    <input type="text" id="save-path" placeholder="폴더를 선택하거나 직접 입력 (예: C:\Users\이름\Downloads\PPT미디어)" readonly>
    <button id="pick-dir-btn" onclick="pickDirectory()">📁 폴더 선택</button>
  </div>
  <p id="dir-note">※ 폴더를 선택하지 않으면 브라우저 기본 다운로드 경로로 저장됩니다. ZIP은 항상 기본 다운로드 경로에 저장됩니다. (폴더 선택: Chrome/Edge 지원)</p>

  <div class="format-row">
    <label>파일명 형식</label>
    <button class="fmt-btn active" onclick="setFmt('original',this)">원본 그대로</button>
    <button class="fmt-btn" onclick="setFmt('numbered',this)">번호 순서 (media_01.mp4)</button>
    <button class="fmt-btn" onclick="setFmt('pptname',this)">PPT명_번호 (파일명_01.png)</button>
  </div>

  <div id="progress-wrap"><div id="progress-bar"><div id="progress-fill"></div></div></div>
  <div id="status"></div>

  <!-- Tabs -->
  <div id="tabs">
    <button class="tab-btn active" onclick="setTab('all',this)">전체 <span class="tab-badge" id="tab-all-n">0</span></button>
    <button class="tab-btn" onclick="setTab('img',this)">🖼 이미지 <span class="tab-badge" id="tab-img-n">0</span></button>
    <button class="tab-btn" onclick="setTab('gif',this)">✨ GIF <span class="tab-badge" id="tab-gif-n">0</span></button>
    <button class="tab-btn" onclick="setTab('vid',this)">🎬 동영상 <span class="tab-badge" id="tab-vid-n">0</span></button>
  </div>

  <div id="toolbar">
    <button class="tb-btn primary" onclick="dlSelected()">⬇ 선택 다운로드</button>
    <button class="tb-btn" onclick="dlAllZip()">📦 전체 ZIP</button>
    <button class="tb-btn" onclick="selectAll()">전체 선택</button>
    <button class="tb-btn" onclick="clearSel()">선택 해제</button>
    <span class="count-badge" id="count-badge"></span>
    <input type="text" id="search-input" placeholder="파일명 검색..." oninput="onSearch(this.value)">
  </div>

  <div id="gallery"></div>
  <div id="empty">미디어 파일이 없습니다</div>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLb(event)">
  <button id="lb-close" onclick="closeLightbox()">✕</button>
  <div id="lb-inner"></div>
</div>

<script>
let extracted = [];
let selected = new Set();
let fmt = 'original';
let pptName = '';
let dirHandle = null;
let currentTab = 'all';

const IMG_EXTS = ['png','jpg','jpeg','bmp','webp','svg','tif','tiff','emf','wmf'];
const GIF_EXTS = ['gif'];
const VID_EXTS = ['mp4','avi','mov','wmv','mkv','flv','webm','m4v','3gp','ogv'];

const MIME_MAP = {
  png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif',
  webp:'image/webp', svg:'image/svg+xml', bmp:'image/bmp',
  mp4:'video/mp4', avi:'video/x-msvideo', mov:'video/quicktime',
  wmv:'video/x-ms-wmv', mkv:'video/x-matroska', flv:'video/x-flv',
  webm:'video/webm', m4v:'video/mp4', '3gp':'video/3gpp', ogv:'video/ogg'
};

function getMediaType(ext){
  if(GIF_EXTS.includes(ext)) return 'gif';
  if(VID_EXTS.includes(ext)) return 'vid';
  return 'img';
}

function onDragOver(e){ e.preventDefault(); document.getElementById('dropzone').classList.add('drag'); }
function onDragLeave(){ document.getElementById('dropzone').classList.remove('drag'); }
function onDrop(e){ e.preventDefault(); onDragLeave(); const f=e.dataTransfer.files[0]; if(f) onFileSelect(f); }

async function pickDirectory(){
  if(!window.showDirectoryPicker){ setStatus('이 브라우저는 폴더 선택을 지원하지 않습니다 (Chrome/Edge 권장)', 'err'); return; }
  try{ dirHandle = await window.showDirectoryPicker({mode:'readwrite'}); document.getElementById('save-path').value = dirHandle.name+' (선택됨 ✓)'; } catch(e){}
}

function setFmt(f, btn){ fmt=f; document.querySelectorAll('.fmt-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }

function getFilename(item, idx){
  const ext = item.name.split('.').pop();
  if(fmt==='numbered') return `media_${String(idx+1).padStart(2,'0')}.${ext}`;
  if(fmt==='pptname') return `${pptName}_${String(idx+1).padStart(2,'0')}.${ext}`;
  return item.name;
}

async function onFileSelect(file){
  if(!file||!file.name.endsWith('.pptx')){ setStatus('.pptx 파일만 지원합니다','err'); return; }
  pptName = file.name.replace(/\.pptx$/i,'');
  extracted=[]; selected=new Set();
  document.getElementById('gallery').innerHTML='';
  document.getElementById('toolbar').classList.remove('show');
  document.getElementById('tabs').classList.remove('show');
  document.getElementById('empty').classList.remove('show');
  setStatus('파일 읽는 중...'); setProgress(10);

  try{
    const buf = await file.arrayBuffer();
    setProgress(30);
    const zip = await JSZip.loadAsync(buf);
    setProgress(50);
    const allExts = [...IMG_EXTS, ...GIF_EXTS, ...VID_EXTS];
    const mediaFiles = Object.keys(zip.files).filter(p=>{
      const ext = p.split('.').pop().toLowerCase();
      return p.startsWith('ppt/media/') && allExts.includes(ext);
    });
    if(!mediaFiles.length){ setStatus('미디어 파일을 찾을 수 없습니다','err'); setProgress(0); return; }

    const items=[];
    for(let i=0;i<mediaFiles.length;i++){
      const path=mediaFiles[i];
      const blob=await zip.files[path].async('blob');
      const ext=path.split('.').pop().toLowerCase();
      const mime=MIME_MAP[ext]||'application/octet-stream';
      const named=new Blob([blob],{type:mime});
      const url=URL.createObjectURL(named);
      const mtype=getMediaType(ext);
      items.push({url, name:path.split('/').pop(), blob:named, ext, mtype});
      setProgress(50+Math.round((i/mediaFiles.length)*45));
    }
    extracted=items;
    setProgress(100);
    setTimeout(()=>setProgress(0),600);

    const imgN=items.filter(x=>x.mtype==='img').length;
    const gifN=items.filter(x=>x.mtype==='gif').length;
    const vidN=items.filter(x=>x.mtype==='vid').length;
    document.getElementById('tab-all-n').textContent=items.length;
    document.getElementById('tab-img-n').textContent=imgN;
    document.getElementById('tab-gif-n').textContent=gifN;
    document.getElementById('tab-vid-n').textContent=vidN;
    document.getElementById('count-badge').textContent=`${items.length}개`;

    setStatus(`총 ${items.length}개 추출 완료 — 이미지 ${imgN}개 · GIF ${gifN}개 · 동영상 ${vidN}개`, 'ok');
    currentTab='all';
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector('.tab-btn').classList.add('active');
    renderGallery(items);
    document.getElementById('tabs').classList.add('show');
    document.getElementById('toolbar').classList.add('show');
  } catch(e){ setStatus('오류: '+e.message,'err'); setProgress(0); }
}

function setTab(tab, btn){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const filtered = tab==='all' ? extracted : extracted.filter(x=>x.mtype===tab);
  renderGallery(filtered);
  document.getElementById('search-input').value='';
}

function renderGallery(items){
  const g=document.getElementById('gallery');
  g.innerHTML='';
  if(!items.length){ document.getElementById('empty').classList.add('show'); return; }
  document.getElementById('empty').classList.remove('show');
  items.forEach((item,localIdx)=>{
    const i=extracted.indexOf(item);
    const card=document.createElement('div');
    card.className='img-card'; card.id='card-'+i;
    const noPreview=['emf','wmf'].includes(item.ext);
    const isVid=item.mtype==='vid';
    const isGif=item.mtype==='gif';
    const typeLabel=isVid?'동영상':isGif?'GIF':'이미지';
    const typeCls=isVid?'vid':isGif?'gif':'img';

    let thumbHtml;
    if(noPreview){
      thumbHtml=`<div class="media-nopreview" onclick="toggleSel(${i})"><span class="type-icon">${isVid?'🎬':'📄'}</span><span>${item.ext.toUpperCase()}</span></div>`;
    } else if(isVid){
      thumbHtml=`<div class="video-play-overlay" onclick="openLightboxVideo('${item.url}','${item.name}')"><video class="video-thumb" src="${item.url}" preload="metadata" muted playsinline></video></div>`;
    } else {
      thumbHtml=`<img class="media-thumb" src="${item.url}" loading="lazy" onclick="openLightboxImg('${item.url}')" title="클릭하여 크게 보기">`;
    }

    card.innerHTML=`
      ${thumbHtml}
      <div class="img-meta">
        <span class="type-badge ${typeCls}">${typeLabel}</span>
        <span class="img-name" title="${item.name}">${item.name}</span>
        <div class="img-actions">
          <button class="act-btn sel-btn" id="sel-${i}" onclick="toggleSel(${i})">선택</button>
          <button class="act-btn" onclick="dlOne(${i})">저장</button>
        </div>
      </div>`;
    g.appendChild(card);
  });
}

function toggleSel(i){
  if(selected.has(i)) selected.delete(i); else selected.add(i);
  const card=document.getElementById('card-'+i);
  const btn=document.getElementById('sel-'+i);
  if(selected.has(i)){ card.classList.add('selected'); btn.classList.add('on'); btn.textContent='✓ 선택됨'; }
  else { card.classList.remove('selected'); btn.classList.remove('on'); btn.textContent='선택'; }
}
function selectAll(){ extracted.forEach((_,i)=>{ selected.add(i); const c=document.getElementById('card-'+i); const b=document.getElementById('sel-'+i); if(c)c.classList.add('selected'); if(b){b.classList.add('on');b.textContent='✓ 선택됨';} }); }
function clearSel(){ selected.forEach(i=>{ const c=document.getElementById('card-'+i); const b=document.getElementById('sel-'+i); if(c)c.classList.remove('selected'); if(b){b.classList.remove('on');b.textContent='선택';} }); selected.clear(); }

function onSearch(q){
  const lower=q.toLowerCase();
  extracted.forEach((item,i)=>{ const c=document.getElementById('card-'+i); if(c) c.style.display=item.name.toLowerCase().includes(lower)?'':'none'; });
}

async function dlOne(i){
  const item=extracted[i]; const filename=getFilename(item,i);
  if(dirHandle){
    try{
      const fh=await dirHandle.getFileHandle(filename,{create:true});
      const ws=await fh.createWritable();
      await ws.write(item.blob); await ws.close();
      setStatus(`저장됨: ${dirHandle.name}/${filename}`,'ok'); return;
    } catch(e){ setStatus('폴더 저장 실패, 기본 다운로드로 저장합니다','err'); }
  }
  const a=document.createElement('a'); a.href=item.url; a.download=filename; a.click();
}

async function dlSelected(){
  const sel=[...selected];
  if(!sel.length){ setStatus('선택된 파일이 없습니다'); return; }
  setStatus(`${sel.length}개 저장 중...`);
  for(const i of sel) await dlOne(i);
  if(dirHandle) setStatus(`${sel.length}개 저장 완료`,'ok');
}

async function dlAllZip(){
  if(!extracted.length) return;
  setStatus('ZIP 파일 생성 중...');
  const zip=new JSZip();
  extracted.forEach((item,i)=>{ zip.file(getFilename(item,i),item.blob); });
  const blob=await zip.generateAsync({type:'blob'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=(pptName||'media')+'.zip'; a.click();
  URL.revokeObjectURL(url);
  setStatus('ZIP 다운로드 완료','ok');
}

function openLightboxImg(src){
  document.getElementById('lb-inner').innerHTML=`<img src="${src}" alt="">`;
  document.getElementById('lightbox').classList.add('show');
}
function openLightboxVideo(src, name){
  document.getElementById('lb-inner').innerHTML=`<video src="${src}" controls autoplay style="max-width:90vw;max-height:85vh;border-radius:10px;display:block;background:#000"></video>`;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){
  document.getElementById('lb-inner').innerHTML='';
  document.getElementById('lightbox').classList.remove('show');
}
function closeLb(e){ if(e.target===document.getElementById('lightbox')) closeLightbox(); }

function setStatus(msg,type=''){ const el=document.getElementById('status'); el.textContent=msg; el.className=type; }
function setProgress(pct){ const w=document.getElementById('progress-wrap'); const f=document.getElementById('progress-fill'); if(pct===0){w.classList.remove('show');f.style.width='0%';return;} w.classList.add('show'); f.style.width=pct+'%'; }
</script>
