<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE CANVAS — 사내 툴킷</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d0b14;--surface:#151220;--surface2:#1e1a2e;--surface3:#272340;
    --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
    --text:#f0eeff;--text2:#9b93c0;--text3:#5a5278;
    --accent:#a78bfa;--accent-dim:rgba(167,139,250,0.12);--accent-border:rgba(167,139,250,0.28);
    --err:#f87171;--radius:14px;--radius-sm:9px;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
    background:var(--bg);
    background-image:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(120,60,200,0.18) 0%,transparent 70%);
    color:var(--text);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;
  }
  .wrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;}
  .logo-wide{width:220px;margin-bottom:2.5rem;}
  .card{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:2.25rem 2rem;}
  h1{font-size:16px;font-weight:600;margin-bottom:4px;}
  .desc{font-size:13px;color:var(--text2);margin-bottom:1.75rem;line-height:1.6;}
  label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;letter-spacing:.03em;}
  .input-wrap{position:relative;margin-bottom:1rem;}
  input[type=password]{
    width:100%;padding:10px 40px 10px 14px;
    background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);
    color:var(--text);font-size:14px;outline:none;transition:border-color .2s;
    font-family:inherit;letter-spacing:.08em;
  }
  input[type=password]:focus{border-color:var(--accent);}
  input[type=password].err{border-color:var(--err);}
  .eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);padding:0;display:flex;align-items:center;}
  .eye-btn:hover{color:var(--text2);}
  .eye-btn svg{width:16px;height:16px;}
  .err-msg{font-size:12px;color:var(--err);margin-top:-6px;margin-bottom:12px;display:none;}
  .err-msg.show{display:block;}
  .login-btn{
    width:100%;padding:11px;
    background:var(--accent-dim);border:1px solid var(--accent-border);border-radius:var(--radius-sm);
    color:var(--accent);font-size:14px;font-weight:500;letter-spacing:.04em;
    cursor:pointer;font-family:inherit;transition:background .18s,border-color .18s;margin-bottom:1rem;
  }
  .login-btn:hover{background:rgba(167,139,250,0.22);border-color:rgba(167,139,250,0.45);}
  .hint{font-size:11px;color:var(--text3);text-align:center;line-height:1.5;}
  footer{margin-top:2.5rem;font-size:11px;color:var(--text3);text-align:center;letter-spacing:.06em;}
  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
</style>
</head>

  <div class="card">
    <h1>사내 툴킷</h1>
    <p class="desc">임직원 전용 도구 모음입니다.<br>관리자에게 받은 비밀번호를 입력하세요.</p>
    <label for="pw">비밀번호</label>
    <div class="input-wrap">
      <input type="password" id="pw" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="eye-btn" onclick="toggleEye()" type="button" aria-label="비밀번호 표시/숨기기">
        <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div class="err-msg" id="err-msg">비밀번호가 올바르지 않습니다.</div>
    <button class="login-btn" onclick="doLogin()">입장하기</button>
    <p class="hint">비밀번호를 모르시면 관리자에게 문의하세요</p>
  </div>
  <footer>© THE CANVAS · 임직원 전용</footer>
</div>
<script>
/* ── 비밀번호 설정 ──────────────────────
   아래 값을 원하는 비밀번호로 바꾸세요.
────────────────────────────────────── */
const PASSWORD = '0725';
function doLogin(){
  const val=document.getElementById('pw').value;
  const inp=document.getElementById('pw');
  const err=document.getElementById('err-msg');
  if(val===PASSWORD){sessionStorage.setItem('toolkit_auth','1');window.location.href='tools.html';}
  else{inp.classList.add('err','shake');err.classList.add('show');setTimeout(()=>inp.classList.remove('shake'),400);inp.value='';inp.focus();}
}
function toggleEye(){
  const inp=document.getElementById('pw');const icon=document.getElementById('eye-icon');
  if(inp.type==='password'){inp.type='text';icon.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';}
  else{inp.type='password';icon.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';}
}
if(sessionStorage.getItem('toolkit_auth')==='1'){window.location.href='tools.html';}
</script>
