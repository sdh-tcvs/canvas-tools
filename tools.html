<!DOCTYPE html>
<!-- saved from url=(0042)file:///C:/Users/USER/Downloads/index.html -->
<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사내 툴킷 — 로그인</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0e;
    --surface: #1a1a18;
    --surface2: #242422;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0ec;
    --text2: #888884;
    --text3: #555552;
    --accent: #4f7fff;
    --accent-dim: rgba(79,127,255,0.12);
    --err: #f87171;
    --radius: 12px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 2.5rem 2rem;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 2rem;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: var(--accent-dim);
    border: 1px solid rgba(79,127,255,0.3);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { width: 18px; height: 18px; color: var(--accent); }
  .logo-text { font-size: 15px; font-weight: 600; color: var(--text); }
  .logo-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }

  h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .desc { font-size: 13px; color: var(--text2); margin-bottom: 2rem; line-height: 1.5; }

  label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .input-wrap { position: relative; margin-bottom: 1rem; }
  input[type=password] {
    width: 100%;
    padding: 10px 40px 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    font-family: inherit;
  }
  input[type=password]:focus { border-color: var(--accent); }
  input[type=password].err { border-color: var(--err); }
  .eye-btn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--text3);
    padding: 0; display: flex; align-items: center;
  }
  .eye-btn:hover { color: var(--text2); }
  .eye-btn svg { width: 16px; height: 16px; }

  .err-msg {
    font-size: 12px; color: var(--err); margin-top: -6px; margin-bottom: 12px;
    display: none;
  }
  .err-msg.show { display: block; }

  .login-btn {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: opacity .15s;
    margin-bottom: 1rem;
  }
  .login-btn:hover { opacity: .88; }
  .login-btn:active { opacity: .75; }

  .hint {
    font-size: 11px; color: var(--text3); text-align: center; line-height: 1.5;
  }
  .shake { animation: shake .4s; }
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)}
    40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(4px)}
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4"></path>
      </svg>
    </div>
    <div>
      <div class="logo-text">사내 툴킷</div>
      <div class="logo-sub">내부 전용 도구 모음</div>
    </div>
  </div>

  <h1>로그인</h1>
  <p class="desc">사내 구성원만 이용할 수 있습니다.<br>관리자에게 받은 비밀번호를 입력하세요.</p>

  <label for="pw">비밀번호</label>
  <div class="input-wrap">
    <input type="password" id="pw" placeholder="비밀번호 입력" autocomplete="current-password" onkeydown="if(event.key===&#39;Enter&#39;)doLogin()">
    <button class="eye-btn" onclick="toggleEye()" id="eye-btn" type="button" aria-label="비밀번호 표시/숨기기">
      <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
  </div>
  <div class="err-msg" id="err-msg">비밀번호가 올바르지 않습니다.</div>

  <button class="login-btn" onclick="doLogin()">입장하기</button>
  <p class="hint">비밀번호를 모르시면 관리자에게 문의하세요</p>
</div>

<script>
/* ── 비밀번호 설정 ──────────────────────────────────────────
   아래 PASSWORD 값을 원하는 비밀번호로 바꾸세요.
   예: const PASSWORD = 'mycompany2025';
────────────────────────────────────────────────────────── */
const PASSWORD = '0725';

function doLogin(){
  const val = document.getElementById('pw').value;
  const inp = document.getElementById('pw');
  const err = document.getElementById('err-msg');
  if(val === PASSWORD){
    sessionStorage.setItem('toolkit_auth','1');
    window.location.href = 'tools.html';
  } else {
    inp.classList.add('err','shake');
    err.classList.add('show');
    setTimeout(()=>inp.classList.remove('shake'),400);
    inp.value='';
    inp.focus();
  }
}

function toggleEye(){
  const inp = document.getElementById('pw');
  const icon = document.getElementById('eye-icon');
  if(inp.type==='password'){
    inp.type='text';
    icon.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    inp.type='password';
    icon.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

if(sessionStorage.getItem('toolkit_auth')==='1'){
  window.location.href='tools.html';
}
</script>


</body></html>
