<html lang="ko">
<head>
<meta charset="UTF-8">

<title>THE CANVAS — 사내 툴킷</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d0b14;--surface:#151220;--surface2:#1e1a2e;--surface3:#272340;
    --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--border3:rgba(255,255,255,0.22);
    --text:#f0eeff;--text2:#9b93c0;--text3:#5a5278;
    --accent:#a78bfa;--accent-dim:rgba(167,139,250,0.1);--accent-border:rgba(167,139,250,0.25);
    --radius:14px;--radius-sm:9px;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
    background:var(--bg);
    background-image:radial-gradient(ellipse 90% 50% at 50% -5%,rgba(120,60,200,0.15) 0%,transparent 65%);
    color:var(--text);min-height:100vh;
  }
  nav{
    position:sticky;top:0;z-index:50;
    background:rgba(13,11,20,.92);backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border2);padding:0 2rem;
    display:flex;align-items:center;justify-content:space-between;height:56px;
  }
  .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .nav-logo-sq{height:28px;width:28px;object-fit:contain;}
  .nav-logo-text{font-size:13px;font-weight:600;color:var(--text);letter-spacing:.1em;}
  .nav-right{display:flex;align-items:center;gap:10px;}
  .nav-badge{font-size:11px;padding:3px 9px;background:var(--accent-dim);border:1px solid var(--accent-border);border-radius:99px;color:var(--accent);}
  .logout-btn{font-size:12px;padding:5px 12px;background:none;border:1px solid var(--border2);border-radius:6px;color:var(--text2);cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s;}
  .logout-btn:hover{border-color:var(--border3);color:var(--text);}
  .page{max-width:960px;margin:0 auto;padding:3rem 2rem 6rem;}
  .hero{margin-bottom:3rem;padding-bottom:2.5rem;border-bottom:1px solid var(--border);}
  .hero-logo{height:30px;margin-bottom:1.5rem;}
  .hero h1{font-size:26px;font-weight:700;letter-spacing:-.4px;margin-bottom:8px;}
  .hero p{font-size:14px;color:var(--text2);line-height:1.65;max-width:480px;}
  .stats-row{display:flex;gap:10px;margin-top:1.25rem;flex-wrap:wrap;}
  .stat-pill{font-size:12px;color:var(--text2);background:var(--surface);border:1px solid var(--border2);border-radius:99px;padding:4px 12px;}
  .stat-pill b{color:var(--text);font-weight:600;}
  .section-label{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;margin-bottom:1rem;}
  .tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px;margin-bottom:3rem;}
  .tool-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .18s,background .18s;}
  .tool-card:hover{border-color:var(--border3);background:var(--surface2);}
  .tool-card-body{padding:1.25rem;flex:1;}
  .tool-card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
  .tool-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border2);flex-shrink:0;}
  .tool-icon svg{width:20px;height:20px;color:var(--accent);}
  .badge{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:600;}
  .badge-new{background:rgba(79,127,255,.15);color:#93b8ff;border:1px solid rgba(79,127,255,.25);}
  .badge-updated{background:rgba(52,211,153,.1);color:#6ee7b7;border:1px solid rgba(52,211,153,.2);}
  .badge-beta{background:rgba(251,191,36,.1);color:#fcd34d;border:1px solid rgba(251,191,36,.2);}
  .tool-name{font-size:15px;font-weight:600;margin-bottom:5px;}
  .tool-desc{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:14px;}
  .tool-tags{display:flex;flex-wrap:wrap;gap:5px;}
  .tag{font-size:11px;padding:2px 8px;background:var(--surface3);border:1px solid var(--border);border-radius:5px;color:var(--text3);}
  .tool-card-footer{border-top:1px solid var(--border);padding:10px 1.25rem;display:flex;align-items:center;justify-content:space-between;}
  .tool-meta{font-size:11px;color:var(--text3);}
  .open-btn{font-size:12px;padding:5px 14px;background:var(--accent-dim);border:1px solid var(--accent-border);border-radius:6px;color:var(--accent);cursor:pointer;font-family:inherit;transition:background .15s;text-decoration:none;font-weight:500;}
  .open-btn:hover{background:rgba(167,139,250,0.2);}
  #detail-overlay{display:none;position:fixed;inset:0;background:rgba(5,3,12,.75);z-index:200;align-items:flex-start;justify-content:center;padding:3rem 1rem;overflow-y:auto;}
  #detail-overlay.show{display:flex;}
  .detail-panel{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);width:100%;max-width:580px;overflow:hidden;}
  .detail-header{padding:1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .detail-header-left{display:flex;gap:14px;align-items:flex-start;flex:1;}
  .detail-title{font-size:17px;font-weight:700;margin-bottom:3px;}
  .detail-subtitle{font-size:12px;color:var(--text2);}
  .close-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;border-radius:6px;display:flex;align-items:center;flex-shrink:0;transition:color .15s;}
  .close-btn:hover{color:var(--text);}
  .close-btn svg{width:18px;height:18px;}
  .detail-body{padding:1.5rem;}
  .detail-section-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
  .feature-list{list-style:none;margin-bottom:1.5rem;}
  .feature-list li{font-size:13px;color:var(--text2);line-height:1.6;padding:5px 0 5px 16px;position:relative;}
  .feature-list li::before{content:'';position:absolute;left:0;top:13px;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.6;}
  .how-steps{margin-bottom:1rem;}
  .how-step{display:flex;gap:12px;margin-bottom:10px;align-items:flex-start;}
  .step-num{width:22px;height:22px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);font-size:11px;font-weight:600;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
  .step-text{font-size:13px;color:var(--text2);line-height:1.6;}
  .step-text strong{color:var(--text);font-weight:600;}
  .detail-footer{border-top:1px solid var(--border);padding:1rem 1.5rem;display:flex;gap:8px;justify-content:flex-end;}
  .btn-ghost{font-size:13px;padding:8px 16px;background:none;border:1px solid var(--border2);border-radius:8px;color:var(--text2);cursor:pointer;font-family:inherit;transition:border-color .15s;}
  .btn-ghost:hover{border-color:var(--border3);color:var(--text);}
  .btn-primary{font-size:13px;padding:8px 20px;background:var(--accent-dim);border:1px solid var(--accent-border);border-radius:8px;color:var(--accent);font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary:hover{background:rgba(167,139,250,0.2);}
  .btn-primary svg{width:14px;height:14px;}
  .coming-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
  .coming-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;opacity:.45;}
  .coming-card-head{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
  .coming-icon{width:30px;height:30px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
  .coming-icon svg{width:15px;height:15px;color:var(--text3);}
  .coming-name{font-size:13px;font-weight:500;color:var(--text2);}
  .coming-desc{font-size:12px;color:var(--text3);line-height:1.5;}
  .coming-badge{display:inline-block;margin-top:7px;font-size:10px;padding:2px 7px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text3);}
</style>
</head>

      </div>
      <button class="close-btn" onclick="closeDetailBtn()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="detail-body">
      <p class="detail-section-title">주요 기능</p>
      <ul class="feature-list" id="d-features"></ul>
      <p class="detail-section-title">사용 방법</p>
      <div class="how-steps" id="d-steps"></div>
    </div>
    <div class="detail-footer">
      <button class="btn-ghost" onclick="closeDetailBtn()">닫기</button>
      <a class="btn-primary" id="d-open-link" href="#" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        도구 열기
      </a>
    </div>
  </div>
</div>
<script>
const TOOLS=[{
  id:'ppt-extractor',name:'PPT 미디어 추출기',
  shortDesc:'PPTX에서 이미지·GIF·동영상을 원본 그대로 추출',
  tags:['PowerPoint','이미지','동영상','GIF'],badge:'updated',badgeLabel:'업데이트',
  updated:'2025-06-02',file:'ppt-image-extractor.html',
  iconSvg:`<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/><line x1="12" y1="12" x2="12" y2="18"/>`,
  features:['PPTX 파일에 삽입된 PNG, JPG, WebP, SVG, GIF, MP4, AVI, MOV 등 모든 미디어 추출','전체/이미지/GIF/동영상 탭으로 종류별 분류 및 필터링','원하는 폴더 경로 직접 지정하여 저장 (Chrome/Edge)','파일명 형식 선택 — 원본 유지 / 번호 순서 / PPT명_번호','개별 저장 또는 선택 항목 일괄 저장, 전체 ZIP 다운로드','이미지 클릭 시 크게 보기, 동영상 미리보기 및 인라인 재생','브라우저 내에서만 처리 — 파일이 서버로 전송되지 않음'],
  steps:[{strong:'PPTX 파일 업로드',text:' — 드래그 앤 드롭 또는 클릭해서 파일 선택'},{strong:'저장 폴더 선택',text:' — 📁 버튼으로 저장 위치 지정 (선택 사항)'},{strong:'파일명 형식 선택',text:' — 원본 그대로 / 번호 순서 / PPT명_번호 중 선택'},{strong:'미디어 확인 및 선택',text:' — 탭으로 필터, 원하는 파일 선택'},{strong:'다운로드',text:' — 개별 저장 / 선택 다운로드 / 전체 ZIP 중 선택'}]
}];
const COMING=[
  {name:'Excel 데이터 정리기',desc:'CSV/XLSX 파일의 중복·빈칸을 자동으로 정리',iconSvg:`<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>`},
  {name:'이미지 일괄 압축기',desc:'여러 이미지를 한 번에 압축 및 리사이즈',iconSvg:`<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>`},
  {name:'PDF 병합기',desc:'여러 PDF를 순서대로 합쳐서 하나의 파일로',iconSvg:`<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>`},
  {name:'텍스트 변환기',desc:'대소문자·줄바꿈·공백 일괄 변환',iconSvg:`<polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>`},
];
function renderTools(){
  document.getElementById('tool-count').textContent=TOOLS.length;
  document.getElementById('tools-grid').innerHTML=TOOLS.map(t=>`
    <div class="tool-card" onclick="openDetail('${t.id}')">
      <div class="tool-card-body">
        <div class="tool-card-head">
          <div class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${t.iconSvg}</svg></div>
          <div>${t.badge?`<span class="badge badge-${t.badge}">${t.badgeLabel}</span>`:'' }</div>
        </div>
        <div class="tool-name">${t.name}</div>
        <div class="tool-desc">${t.shortDesc}</div>
        <div class="tool-tags">${t.tags.map(g=>`<span class="tag">${g}</span>`).join('')}</div>
      </div>
      <div class="tool-card-footer">
        <span class="tool-meta">업데이트 ${t.updated}</span>
        <a class="open-btn" href="${t.file}" target="_blank" onclick="ev(event)">열기 →</a>
      </div>
    </div>`).join('');
  document.getElementById('coming-grid').innerHTML=COMING.map(c=>`
    <div class="coming-card">
      <div class="coming-card-head">
        <div class="coming-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.iconSvg}</svg></div>
        <div class="coming-name">${c.name}</div>
      </div>
      <div class="coming-desc">${c.desc}</div>
      <span class="coming-badge">준비 중</span>
    </div>`).join('');
}
function ev(e){e.stopPropagation();}
function openDetail(id){
  const t=TOOLS.find(x=>x.id===id);if(!t)return;
  document.getElementById('d-icon').innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${t.iconSvg}</svg>`;
  document.getElementById('d-title').textContent=t.name;
  document.getElementById('d-subtitle').textContent=`최근 업데이트: ${t.updated}`;
  document.getElementById('d-features').innerHTML=t.features.map(f=>`<li>${f}</li>`).join('');
  document.getElementById('d-steps').innerHTML=t.steps.map((s,i)=>`<div class="how-step"><div class="step-num">${i+1}</div><div class="step-text"><strong>${s.strong}</strong>${s.text}</div></div>`).join('');
  document.getElementById('d-open-link').href=t.file;
  document.getElementById('detail-overlay').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeDetail(e){if(e.target===document.getElementById('detail-overlay'))closeDetailBtn();}
function closeDetailBtn(){document.getElementById('detail-overlay').classList.remove('show');document.body.style.overflow='';}
function logout(){sessionStorage.removeItem('toolkit_auth');window.location.href='index.html';}
if(sessionStorage.getItem('toolkit_auth')!=='1'){window.location.href='index.html';}
renderTools();
</script>
</body>
</html>
